name: Manual Deploy to GitHub Pages

on:
  workflow_dispatch:  # 👈 Permet de lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout developp branch
        uses: actions/checkout@v3
        with:
          ref: developp

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Change si besoin

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build  # ou vite build / astro build / etc.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # ou ./build si ton projet sort là
          publish_branch: gh-pages